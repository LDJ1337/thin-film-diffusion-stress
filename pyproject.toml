[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thin-film-diffusion-stress"
version = "0.1.0"
description = "Coursework model of layered diffusion, mismatch stress and delamination energy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "John Goodman"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["run_model"]

[tool.setuptools.packages.find]
where = ["."]
include = ["solvers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
